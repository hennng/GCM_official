<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCM 領唱配置與練習簡報表</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#2a2622;--muted:#7a726a;--line:#e7e1d9;--accent:#b4562f;--main:#b4562f;--harmony:#3973a8;--backing:#71883b;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}.wrap{max-width:1100px;margin:auto}header,.toolbar,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}header{justify-content:space-between;margin-bottom:12px}h1{font-size:21px;margin:0}h2{font-size:17px;margin:22px 0 8px}button,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:white}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.controls select{min-width:170px}.chart{display:grid;gap:8px}.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 42px;gap:8px;align-items:center}.track{height:13px;border-radius:99px;background:#ece8e1;overflow:hidden}.bar{height:100%;border-radius:99px;min-width:0}.bar.main{background:var(--main)}.bar.harmony{background:var(--harmony)}.bar.backing{background:var(--backing)}.role-legend{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}.legend{display:flex;align-items:center;gap:5px;font-size:13px}.dot{width:10px;height:10px;border-radius:50%}.member-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.member-card{border:1px solid var(--line);border-radius:10px;padding:9px}.member-card strong{display:block;margin-bottom:6px}.member-card select{width:100%}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:13px;color:var(--muted)}tr:last-child td{border-bottom:0}.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 8px;margin:2px;font-size:13px}.badge.main{border-color:var(--main);color:var(--main)}.badge.harmony{border-color:var(--harmony);color:var(--harmony)}.badge.backing{border-color:var(--backing);color:var(--backing)}.notice{min-height:1.5em;color:var(--muted)}.brief-header{margin-bottom:14px}.brief-item{padding:10px 0;border-bottom:1px solid var(--line);break-inside:avoid}.brief-item:last-child{border:0}.brief-item h3{margin:0 0 4px;font-size:16px}.brief-roles{display:flex;flex-wrap:wrap;gap:4px}.count{font-size:12px;color:var(--muted)}@media(max-width:600px){body{padding:10px}.bar-row{grid-template-columns:85px 1fr 30px}.member-grid{grid-template-columns:1fr}.controls>*{flex:1}.controls select{min-width:0}}@media print{body{padding:0;background:#fff;color:#111;font-size:10pt}.wrap{max-width:none}header,.controls,.no-print,#assignment-editor,#msg{display:none!important}h1{font-size:17pt}.card{border:0;padding:0}.brief-header{margin-bottom:6px}.brief-item{padding:5px 0}.brief-item h3{font-size:11pt}.badge{font-size:9pt;padding:1px 5px}.print-stats{display:block!important}.role-legend{margin:3px 0}.chart{gap:3px}.bar-row{grid-template-columns:100px 1fr 28px;gap:5px;font-size:9pt}.track{height:8px}}
</style>
</head>
<body><main class="wrap">
<header><h1>🎶 領唱配置與練習簡報表</h1><div class="row"><span id="authState" class="muted">公開瀏覽</span><button id="authBtn" class="primary" type="button">使用 Google 登入</button></div></header>
<div class="controls no-print"><label>活動 <select id="eventSelect" aria-label="選擇活動"></select></label><button id="csvBtn" type="button">匯出 CSV</button><button id="briefBtn" type="button">下載簡報表 HTML</button><button id="printBtn" type="button">列印／另存 PDF</button></div>
<div id="msg" class="notice" role="status" aria-live="polite"></div><section id="app">載入中…</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
'use strict';
const FIREBASE_CONFIG={apiKey:'AIzaSyARhWjIkQacQPdNLaEY7bvsf9lIAKnfgZE',authDomain:'gcmofficial.firebaseapp.com',projectId:'gcmofficial',storageBucket:'gcmofficial.firebasestorage.app',messagingSenderId:'921580347852',appId:'1:921580347852:web:5f0a05f6b545ec37aafd69',measurementId:'G-BJ4TJKXWHW'};
const ROLES=[{id:'主唱',label:'主唱',cls:'main'},{id:'合音',label:'合音',cls:'harmony'},{id:'伴唱',label:'伴唱',cls:'backing'}],MAX_MAIN=8,S={events:[],members:[],songs:[]};let db,auth,user=null,isEditor=false,currentEventId='';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(message){$('#msg').textContent=message||''}
function currentEvent(){return S.events.find(e=>e.id===currentEventId)||S.events.filter(e=>e.date>=new Date().toLocaleDateString('sv')).sort((a,b)=>a.date.localeCompare(b.date))[0]||S.events.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0]||null}
function eventSongs(e){return S.songs.filter(s=>s.eventId===e?.id).sort((a,b)=>(a.order||0)-(b.order||0))}
function rolesOf(song){const roles={...(song.leaderRoles||{})};for(const id of Array.isArray(song.leaders)?song.leaders:(song.leader?[song.leader]:[]))if(!roles[id])roles[id]='主唱';return roles}
function leaderSummary(song){const r=rolesOf(song);return ROLES.map(role=>{const names=S.members.filter(m=>r[m.id]===role.id).map(m=>m.name);return names.length?`${role.label}：${names.join('、')}`:''}).filter(Boolean).join('　｜　')||'尚未安排'}
function countsFor(e){const songs=eventSongs(e);return S.members.map(m=>({member:m,total:songs.filter(s=>!!rolesOf(s)[m.id]).length,main:songs.filter(s=>rolesOf(s)[m.id]==='主唱').length,harmony:songs.filter(s=>rolesOf(s)[m.id]==='合音').length,backing:songs.filter(s=>rolesOf(s)[m.id]==='伴唱').length})).sort((a,b)=>b.total-a.total||a.member.name.localeCompare(b.member.name))}
function roleTotals(songs){return ROLES.map(role=>({role,count:songs.reduce((sum,s)=>sum+Object.values(rolesOf(s)).filter(x=>x===role.id).length,0)}))}
function render(){const e=currentEvent();$('#authState').textContent=user?(isEditor?`管理者：${user.email||'Google 帳號'}`:`已登入：${user.email||'Google 帳號'}（僅可瀏覽）`):'公開瀏覽';$('#eventSelect').innerHTML=S.events.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(x=>`<option value="${esc(x.id)}" ${e?.id===x.id?'selected':''}>${esc(x.date||'')} ${esc(x.name||'')}</option>`).join('');if(!e){$('#app').innerHTML='<div class="card">目前沒有活動或曲目資料。</div>';return}currentEventId=e.id;const songs=eventSongs(e),totals=roleTotals(songs),max=Math.max(1,...totals.map(x=>x.count));const chart=`<div class="role-legend">${ROLES.map(r=>`<span class="legend"><i class="dot" style="background:var(--${r.cls})"></i>${r.label}</span>`).join('')}</div><div class="chart">${totals.map(x=>`<div class="bar-row"><span>${x.role.label}</span><div class="track"><div class="bar ${x.role.cls}" style="width:${100*x.count/max}%"></div></div><b>${x.count}</b></div>`).join('')}</div>`;const counts=countsFor(e);const members=`<div class="member-grid">${counts.map(x=>`<div class="member-card"><strong>${esc(x.member.name)} <span class="count">${x.total} 首</span></strong><div class="count">主唱 ${x.main} ・合音 ${x.harmony} ・伴唱 ${x.backing}</div></div>`).join('')||'<div class="muted">尚無團員</div>'}</div>`;const assignmentEditor=isEditor?`<h2 class="no-print">編輯角色</h2><p class="muted no-print">每首最多 8 位主唱；合音與伴唱人數不限。沿用既有曲目設定，可直接修改。</p><div id="assignment-editor" class="table-wrap no-print"><table><thead><tr><th>曲目</th>${S.members.map(m=>`<th>${esc(m.name)}</th>`).join('')}</tr></thead><tbody>${songs.map(s=>{const roles=rolesOf(s),mainN=Object.values(roles).filter(r=>r==='主唱').length;return `<tr><th>${esc(s.title)}</th>${S.members.map(m=>`<td><select aria-label="${esc(s.title)} ${esc(m.name)}角色" data-role-song="${esc(s.id)}" data-role-member="${esc(m.id)}"><option value="" ${!roles[m.id]?'selected':''}>未指定</option>${ROLES.map(r=>`<option value="${r.id}" ${roles[m.id]===r.id?'selected':''} ${r.id==='主唱'&&mainN>=MAX_MAIN&&roles[m.id]!=='主唱'?'disabled':''}>${r.label}${r.id==='主唱'&&mainN>=MAX_MAIN&&roles[m.id]!=='主唱'?'（上限）':''}</option>`).join('')}</select></td>`).join('')}</tr>`}).join('')}</tbody></table></div>`:'';const brief=`<section id="brief-content"><div class="brief-header"><h2>${esc(e.name||'活動')}｜練習簡報表</h2><div class="muted">${esc(e.date||'')} ${esc(e.place||'')}</div><div class="print-stats"><h3>角色統計</h3>${chart}<h3>團員曲目數</h3>${members}</div></div>${songs.map(s=>`<article class="brief-item"><h3>${esc(s.title)} <small>${esc(s.key||'')}</small></h3><div class="brief-roles">${ROLES.map(r=>{const names=S.members.filter(m=>rolesOf(s)[m.id]===r.id);return names.length?`<span class="badge ${r.cls}">${r.label}：${names.map(m=>esc(m.name)).join('、')}</span>`:''}).join('')||'<span class="muted">尚未安排角色</span>'}</div></article>`).join('')||'<p class="muted">尚未新增曲目</p>'}</section>`;$('#app').innerHTML=`<div class="card"><h2>${esc(e.name||'活動')}</h2><div class="muted">${esc(e.date||'')} ${esc(e.place||'')}</div></div><h2>角色統計圖</h2><div class="card">${chart}</div><h2>每位團員承擔曲目數</h2><div class="card">${members}</div><h2>領唱配置與簡報表</h2><div class="card" style="padding:12px 16px">${brief}</div>${assignmentEditor}`;}
function csvCell(value){let s=String(value??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csvExport(){const e=currentEvent();if(!e)return;const songs=eventSongs(e),headers=['曲目','Key','主唱','合音','伴唱',...S.members.map(m=>`${m.name}角色`)],rows=songs.map(s=>{const r=rolesOf(s);return[s.title,s.key||'',...ROLES.map(role=>S.members.filter(m=>r[m.id]===role.id).map(m=>m.name).join('、')),...S.members.map(m=>r[m.id]||'')]});const content='\ufeff'+[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download=`${e.name||'活動'}-領唱配置.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function briefingHtml(){const e=currentEvent();if(!e)return '';const songs=eventSongs(e),totals=roleTotals(songs),max=Math.max(1,...totals.map(x=>x.count)),counts=countsFor(e);const bars=totals.map(x=>`<div class="barrow"><span>${esc(x.role.label)}</span><div class="track"><i class="${x.role.cls}" style="width:${100*x.count/max}%"></i></div><b>${x.count}</b></div>`).join('');const people=counts.map(x=>`<span class="person">${esc(x.member.name)} ${x.total}首（主唱${x.main}／合音${x.harmony}／伴唱${x.backing}）</span>`).join('');const songRows=songs.map(s=>`<article><h3>${esc(s.title)} <small>${esc(s.key||'')}</small></h3><p>${ROLES.map(r=>{const names=S.members.filter(m=>rolesOf(s)[m.id]===r.id).map(m=>m.name);return names.length?`${r.label}：${names.join('、')}`:''}).filter(Boolean).map(esc).join('　｜　')||'尚未安排角色'}</p></article>`).join('');return `<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(e.name)}｜練習簡報表</title><style>body{font:14px/1.45 system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#222;max-width:900px;margin:24px auto;padding:0 16px}h1{font-size:23px;margin:0}h2{font-size:16px;margin:14px 0 6px}.muted,small{color:#666}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel{border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0}.barrow{display:grid;grid-template-columns:60px 1fr 28px;gap:8px;align-items:center;margin:4px 0}.track{height:10px;background:#eee;border-radius:8px;overflow:hidden}.track i{display:block;height:100%}.main{background:#b4562f}.harmony{background:#3973a8}.backing{background:#71883b}.people{display:flex;flex-wrap:wrap;gap:5px}.person{background:#f4f1ed;border-radius:12px;padding:3px 8px;font-size:12px}article{padding:6px 0;border-bottom:1px solid #ddd;break-inside:avoid}article h3{font-size:15px;margin:0}article p{margin:3px 0}.actions{margin:12px 0}@media print{body{margin:0 auto;font-size:10pt}.actions{display:none}article{padding:4px 0}.panel{padding:7px;margin:5px 0}}@media(max-width:600px){.stats{grid-template-columns:1fr}}</style><body><h1>${esc(e.name||'活動')}｜練習簡報表</h1><div class="muted">${esc(e.date||'')} ${esc(e.place||'')}</div><div class="stats"><section class="panel"><h2>角色統計</h2>${bars}</section><section class="panel"><h2>團員承擔曲目數</h2><div class="people">${people||'尚無團員'}</div></section></div><section class="panel"><h2>曲目與領唱配置</h2>${songRows||'尚未新增曲目'}</section><div class="actions"><button onclick="print()">列印／另�� PDF</button></div></body></html>`}
function downloadBrief(){const text=briefingHtml();if(!text)return;const url=URL.createObjectURL(new Blob([text],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`${currentEvent()?.name||'活動'}-練習簡報表.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function saveRole(select){if(!isEditor)throw Error('請以授權的管理者帳號登入');const songId=select.dataset.roleSong,memberId=select.dataset.roleMember,role=select.value,ref=db.collection('songs').doc(songId);await db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists)throw Error('找不到曲目');const song=snap.data(),roles=rolesOf(song),old=roles[memberId]||'';if(role==='主唱'&&old!=='主唱'&&Object.values(roles).filter(x=>x==='主唱').length>=MAX_MAIN)throw Error(`每首曲目最多指定 ${MAX_MAIN} 位主唱`);if(role)roles[memberId]=role;else delete roles[memberId];tx.update(ref,{leaderRoles:roles,leaders:Object.keys(roles)})});status('角色配置已儲存')}
$('#eventSelect').addEventListener('change',e=>{currentEventId=e.target.value;render()});$('#csvBtn').addEventListener('click',csvExport);$('#briefBtn').addEventListener('click',downloadBrief);$('#printBtn').addEventListener('click',()=>window.print());$('#authBtn').addEventListener('click',async()=>{try{if(user)await auth.signOut();else await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){status('登入失敗：'+(e.message||e.code))}});document.addEventListener('change',async e=>{if(!e.target.matches('[data-role-song]'))return;const el=e.target;el.disabled=true;try{await saveRole(el)}catch(error){status(error.message||error.code||String(error));render()}finally{el.disabled=!isEditor}});
try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async next=>{user=next;isEditor=false;if(next){try{await db.doc(`editorStatus/${next.uid}`).get();if(user?.uid===next.uid)isEditor=true}catch{isEditor=false}}render()});for(const name of ['events','members','songs'])db.collection(name).onSnapshot(q=>{S[name]=q.docs.map(d=>({id:d.id,...d.data()}));if(name==='events'&&!currentEventId){try{currentEventId=localStorage.getItem('ev')||''}catch{}}render()},e=>status('資料讀取失敗：'+(e.message||e.code)))}catch(error){$('#app').textContent='Firebase 初始化失敗：'+(error.message||error.code)}
</script></body></html>
