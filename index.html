<html lang="zh-Hant"><head><meta charset="utf-8">

<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1917;--cd:#262321;--tx:#f0ebe5;--mu:#a39b92;--ln:#3a3631;--ac:#e0875f;--ok:#55c488;--no:#e5766e;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1b1917;--cd:#262321;--tx:#f0ebe5;--mu:#a39b92;--ln:#3a3631;--ac:#e0875f;--ok:#55c488;--no:#e5766e;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding:0 14px 40px}.w{max-width:960px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 0 8px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:22px 0 8px}nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px}nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}button{cursor:pointer}button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}.c b{display:block;font-size:24px}.c span,.mu{color:var(--mu);font-size:13px}.sc{overflow-x:auto;background:var(--cd);border:1px solid var(--ln);border-radius:12px}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--cd)}th{font-weight:600;font-size:13px;color:var(--mu)}tr:last-child td{border-bottom:0}td.h{cursor:pointer;font-weight:600}td.sel{outline:3px solid var(--ac);outline-offset:-3px}td input{width:54px;padding:3px}.y{color:var(--ok);font-weight:700}.n{color:var(--no)}.q{color:var(--mu)}.dim{opacity:.5}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.row input[type=text],.row textarea{flex:1;min-width:140px}.it{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--ln)}.it:last-child{border:0}.x{margin-left:auto;border:0;background:none;color:var(--mu)}.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.admin-list{padding:0}.admin-item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--ln)}.admin-item:last-child{border:0}
.stat-card{display:flex;flex-direction:column;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--ln);background:var(--cd);padding:14px 16px;border-radius:12px;color:var(--tx);transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}.stat-card:hover,.stat-card:focus-visible{transform:translateY(-1px);border-color:var(--ac);box-shadow:0 8px 18px rgba(180,86,47,.08)}.stat-card b{display:block;font-size:24px;line-height:1.2;margin-bottom:2px}.stat-card span{display:block;color:var(--mu);font-size:13px}.stat-card .mini{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
@media (max-width:720px){body{padding:0 10px 32px}.header,.row{gap:6px}.nav{padding-bottom:10px}.g{grid-template-columns:repeat(2,minmax(140px,1fr))}.c b{font-size:22px}.row input[type=text],.row textarea{min-width:120px}}@media (max-width:520px){header{display:block}.w{max-width:100%}.g{grid-template-columns:1fr}.sc{border-radius:10px}}@media (min-width:961px){.row{align-items:center}}
</style></head><body><div class="w">
<header><h1>🎶 讚頌團 練習儀表板</h1><div class="row"><select id="evsel" data-a="ev" aria-label="選擇活動"></select><button id="authBtn" class="p" type="button">使用 Google 登入</button></div></header>
<div id="authState" class="mu"></div>
<nav id="nav"></nav><div id="msg" class="mu"></div><div id="app">載入中…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const S={events:[],members:[],songs:[],sessions:[],att:{},scores:{},logs:[]};
const FIREBASE_CONFIG={
 apiKey:'AIzaSyARhWjIkQacQPdNLaEY7bvsf9lIAKnfgZE',
 authDomain:'gcmofficial.firebaseapp.com',
 projectId:'gcmofficial',
 storageBucket:'gcmofficial.firebasestorage.app',
 messagingSenderId:'921580347852',
 appId:'1:921580347852:web:5f0a05f6b545ec37aafd69',
 measurementId:'G-BJ4TJKXWHW'
};
let db=null,auth=null,user=null,editor=false,ev=null,tab='home',edit=false,pend=false,showOut=false,editingDoc=null,importing=false;
try{ev=localStorage.getItem('ev')}catch(e){}
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const TABS=[['home','總覽'],['songs','曲目與人選'],['att','出缺席'],['log','練習紀錄'],['set','設定']];
const ST={todo:'未練',wip:'練習中',ok:'已 OK'};
const IMPORT_COLLECTIONS=['events','members','songs','sessions','attendance','scores','logs'];
const IMPORT_ORDER=['events','members','songs','sessions','attendance','scores','logs'];
const ADMIN_FIELDS={
  events:[['name','活動名稱','text'],['date','日期','date'],['place','地點','text'],['out','不參加團員','array']],
  members:[['name','團員姓名','text'],['gender','性別','text'],['order','排序','number']],
  songs:[['eventId','活動','select','events'],['title','曲目名稱','text'],['key','Key','text'],['leaders','領唱團員','array'],['status','狀態','select','status'],['link','連結','url'],['order','排序','number']],
  sessions:[['eventId','活動','select','events'],['date','日期','date'],['label','場次標籤','text']],
  logs:[['eventId','活動','select','events'],['songId','曲目 ID（空白代表整體）','select','songs'],['sessionId','場次 ID（可留空）','select','sessions'],['issue','問題','text'],['fix','改善方式','text'],['done','已完成','checkbox'],['ts','時間戳','number']]
};
const AUTH_ERR='請先以授權的管理者帳號登入';
const isEditor=()=>!!user&&editor;
const assertEditor=()=>{if(!isEditor())throw new Error(AUTH_ERR);};
const sortByDate=(a,b)=>String(a.date||'').localeCompare(String(b.date||''));
const dateText=value=>typeof value==='string'?value:'';
const normalizeEventId=id=>String(id||'');
function sub(name,fn){
  if(!db || !db.collection) return;
  return db.collection(name).onSnapshot(q=>{fn(q.docs.map(d=>({id:d.id,...d.data()})));render();},e=>{$('#msg').textContent='資料讀取失敗：'+(e.message||e.code);});
}
function recordSub(name,key,parentField,childField){
  if(!db||!db.collection) return;
  return db.collection(name).onSnapshot(q=>{
    const records={};
    q.docs.forEach(doc=>{
      const data=doc.data(),parent=data[parentField],child=data[childField];
      if(typeof parent!=='string'||typeof child!=='string')return;
      records[parent]??={};
      records[parent][child]=data.value;
    });
    S[key]=records;render();
  },e=>{$('#msg').textContent='資料讀取失敗：'+(e.message||e.code);});
}
function E(){
  const events=[...S.events].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  return events.find(e=>e.id===ev)||events.filter(e=>typeof e.date==='string'&&e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0]||events[0]||null;
}
const byo=(a,b)=>(a.order||0)-(b.order||0);
function render(){
  if(document.activeElement?.matches('input,select:not(#evsel),textarea')){pend=true;return;}
  pend=false;
  try{
    $('#authBtn').textContent=user?'登出':'使用 Google 登入';
    $('#authState').textContent=user?(isEditor()?`管理者：${user.email}`:`已登入：${user.email||'Google 帳號'}（僅可瀏覽）`):'公開瀏覽';
    $('#nav').innerHTML=TABS.map(([k,v])=>`<button class="${tab===k?'on':''}" data-t="${k}">${v}</button>`).join('');
    const e=E();
    $('#evsel').innerHTML=[...S.events].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(x=>`<option value="${esc(x.id)}" ${e&&x.id===e.id?'selected':''}>${esc(dateText(x.date))} ${esc(x.name||'')}</option>`).join('');
    if(!e&&tab!=='set'){$('#app').innerHTML='<p>尚無活動，請到「設定」新增第一個活動。</p>';return;}
    $('#app').innerHTML=({home,songs,att,log,set})[tab](e);
  }catch(error){
    console.error('Dashboard rendering failed:',error);
    $('#msg').textContent='畫面產生失敗：'+(error.message||error);
    $('#app').innerHTML='<p>資料格式可能不完整，請檢查 Firestore 文件欄位。</p>';
  }
}
function ctx(e){
  const songs=S.songs.filter(s=>s.eventId===e?.id).sort(byo);
  const sess=S.sessions.filter(s=>s.eventId===e?.id).sort(sortByDate);
  return {songs,sess};
}
const mn=id=>S.members.find(m=>m.id===id)?.name||'';
const AM=e=>S.members.filter(m=>showOut||!(e.out||[]).includes(m.id));
const LD=s=>Array.isArray(s.leaders)?s.leaders:(s.leader?[s.leader]:[]);
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const ttl=s=>safe(s.link)?`<a href="${esc(safe(s.link))}" target="_blank" rel="noopener" style="color:var(--ac)">${esc(s.title)} 🔗</a>`:esc(s.title);
function home(e){
  const {songs,sess}=ctx(e),ok=songs.filter(s=>s.status==='ok').length,nol=songs.filter(s=>!LD(s).some(id=>!(e.out||[]).includes(id))),open=S.logs.filter(l=>l.eventId===e.id&&!l.done);
  const nx=sess.find(s=>typeof s.date==='string'&&s.date>=today());
  const act=S.members.filter(m=>!(e.out||[]).includes(m.id));
  const cnt=nx?act.filter(m=>(S.att[nx.id]||{})[m.id]==='y').length:0;
  const stats=[
    {label:'曲目已 OK', value:`${ok}/${songs.length}`, tab:'songs', hint:'查看曲目與分數'},
    {label:'尚未指定領唱', value:String(nol.length), tab:'songs', hint:'補齊領唱人選'},
    {label:nx?`下次練習 ${dateText(nx.date).slice(5)}`:'無待練場次', value:nx?`${cnt}/${act.length}`:'–', tab:'att', hint:nx?'查看出缺席':'安排場次'},
    {label:'未解決改善項目', value:String(open.length), tab:'log', hint:'直接新增或修正'}
  ];
  const todoList=[...nol.map(s=>`<button type="button" class="it" data-t="songs" style="width:100%;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer"><div>🎤 〈${esc(s.title)}〉還沒有領唱人選</div></button>`),...open.map(l=>`<button type="button" class="it" data-t="log" style="width:100%;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer"><div>🔧 〈${esc(S.songs.find(s=>s.id===l.songId)?.title||'整體')}〉${esc(l.issue)} <span class="mu">→ ${esc(l.fix||'待討論')}</span></div></button>`)]
  return `<div class="c" style="margin-bottom:10px"><b>${esc(e.name)}</b><span>${esc(dateText(e.date))} ${esc(e.place||'')}</span></div>
  <div class="g">${stats.map(item=>`<button type="button" class="stat-card" data-t="${item.tab}"><span class="mini">${esc(item.label)}</span><b>${esc(item.value)}</b><span>${esc(item.hint)}</span></button>`).join('')}</div>
  <h2>待辦</h2><div class="c" style="padding:0">${todoList.length?todoList.join(''):`<div class="it mu">目前沒有待辦 🎉</div>`}</div>`;
}
function heat(n){return n==null?'':`background:hsl(${(n-1)*13} 60% 50% / .3)`}
function songs(e){
  const {songs}=ctx(e),M=AM(e);
  return `<div class="row"><span class="mu">${isEditor()?'登入管理者可編輯分數。':'登入授權的管理者帳號後可編輯分數。'}</span><button data-a="showout" class="${showOut?'on':''}" style="margin-left:auto">顯示未參加者</button></div>
  <div class="sc"><table><tr><th>曲目</th><th>Key</th><th>領唱</th>${M.map(m=>`<th>${esc(m.name)}${(e.out||[]).includes(m.id)?'<br><span class="q">不參加</span>':''}</th>`).join('')}<th>狀態</th></tr>
  ${songs.map(s=>`<tr><td>${ttl(s)}</td><td>${esc(s.key||'')}</td><td>${esc(LD(s).filter(id=>M.some(m=>m.id===id)).map(mn).join('、'))||'<span class="q">–</span>'}</td>${M.map(m=>{const v=(S.scores[m.id]||{})[s.id];return isEditor()?`<td><input type="number" min="1" max="10" value="${v??''}" data-a="score" data-s="${s.id}" data-m="${m.id}"></td>`:`<td class="h ${LD(s).includes(m.id)?'sel':''}" style="${heat(v)}" data-a="lead" data-s="${s.id}" data-m="${m.id}">${v??'–'}</td>`}).join('')}<td><select data-a="status" data-s="${s.id}">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${s.status===k?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`;
}
function att(e){
  const {sess}=ctx(e),M=AM(e),t=today(),sym={y:'<span class="y">✓</span>',n:'<span class="n">請假</span>','?':'<span class="q">?</span>'};
  return `<div class="row"><span class="mu">${isEditor()?'管理者可點格子切換：✓ 出席 → 請假 → ? 未確認。':'登入授權的管理者帳號後可修改出席狀態。'}</span><button data-a="showout" class="${showOut?'on':''}" style="margin-left:auto">顯示未參加者</button></div><div class="sc"><table><tr><th>成員</th>${sess.map(s=>`<th class="${s.date<t?'dim':''}">${esc(dateText(s.date).slice(5))}<br>${esc(s.label||'')}</th>`).join('')}</tr>
  ${M.map(m=>`<tr><td>${esc(m.name)}${(e.out||[]).includes(m.id)?' <span class="q">（不參加）</span>':''}</td>${sess.map(s=>`<td class="h ${s.date<t?'dim':''}" data-a="att" data-s="${s.id}" data-m="${m.id}">${sym[(S.att[s.id]||{})[m.id]||'?']}</td>`).join('')}</tr>`).join('')}
  <tr><td><b>出席人數</b></td>${sess.map(s=>`<td><b>${M.filter(m=>(S.att[s.id]||{})[m.id]==='y').length}/${M.length}</b></td>`).join('')}</tr></table></div>`;
}
function log(e){
  const {songs,sess}=ctx(e),L=S.logs.filter(l=>l.eventId===e.id).sort((a,b)=>b.ts-a.ts);
  const sessionOptions=S.sessions.filter(s=>s.eventId===e.id).sort(sortByDate).map(s=>`<option value="${esc(s.id)}">${esc(dateText(s.date).slice(5))} ${esc(s.label||'')}</option>`).join('');
  const songOptions=S.songs.filter(s=>s.eventId===e.id).sort(byo).map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join('');
  return `<div class="c"><h2 style="margin-top:0">新增練習紀錄</h2><div class="row"><select id="logSession"><option value="">選擇場次</option>${sessionOptions}</select><select id="logSong"><option value="">整體</option>${songOptions}</select></div><div class="row"><input type="text" id="logIssue" placeholder="發現的問題（如：副歌換氣不齊）"></div><div class="row"><input type="text" id="logFix" placeholder="改善方式 / 下次要練的"><button class="p" data-a="addlog">新增</button></div></div>
  <h2>紀錄</h2><div class="c" style="padding:0">${L.map(l=>`<div class="it"><input type="checkbox" ${l.done?'checked':''} data-a="done" data-id="${l.id}"><div style="${l.done?'opacity:.5':''}"><b>${esc(S.songs.find(s=>s.id===l.songId)?.title||'整體')}</b> <span class="tag">${esc(S.sessions.find(s=>s.id===l.sessionId)?.date.slice(5)||'')}</span><br>${esc(l.issue)}<br><span class="mu">→ ${esc(l.fix||'')}</span></div><button class="x" data-a="del" data-p="logs/${l.id}">✕</button></div>`).join('')||'<div class="it mu">還沒有練習紀錄</div>'}</div>`;
}
function set(e){
  const {songs,sess}=ctx(e);
  const summary=e?`<div class="c"><b>${esc(e.name)}</b><span>${esc(dateText(e.date))} ${esc(e.place||'')}</span></div>`:'<div class="c"><b>尚未選擇活動</b></div>';
  return `<h2>設定</h2>${summary}<h2>資料管理（管理者）</h2>${adminPanel()}`;
}
function adminField(kind,field,record){
  const [name,label,type,source]=field,value=name==='leaders'&&record?LD(record):record?.[name];
  if(type==='array'){
    const selected=new Set(Array.isArray(value)?value:[]);
    return `<label>${esc(label)}<select data-field="${name}" multiple size="${Math.min(Math.max(S.members.length,2),6)}">${S.members.map(m=>`<option value="${esc(m.id)}" ${selected.has(m.id)?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`;
  }
  if(type==='select'){
    const rows=source==='events'?S.events:source==='songs'?S.songs:source==='sessions'?S.sessions:[{id:'todo',name:'未練'},{id:'wip',name:'練習中'},{id:'ok',name:'已 OK'}];
    const options=(source==='status'?rows.map(x=>[x.id,x.name]):rows.map(x=>[x.id,source==='events'?`${x.date||''} ${x.name||''}`:source==='songs'?x.title||x.id:`${x.date||''} ${x.label||''}`]));
    return `<label>${esc(label)}<select data-field="${name}"><option value="">${source==='status'?'選擇狀態':'不指定'}</option>${options.map(([id,text])=>`<option value="${esc(id)}" ${String(id)===String(value)?'selected':''}>${esc(text)}</option>`).join('')}</select></label>`;
  }
  if(type==='checkbox')return `<label><input type="checkbox" data-field="${name}" ${value?'checked':''}> ${esc(label)}</label>`;
  return `<label>${esc(label)}<input type="${type}" data-field="${name}" value="${esc(value??'')}" ${type==='number'?'step="1"':''}></label>`;
}
function adminCollection(kind,title){
  const rows=S[kind]||[],record=editingDoc?.kind===kind?rows.find(x=>x.id===editingDoc.id):null;
  const schema=ADMIN_FIELDS[kind],fields=schema.map(f=>adminField(kind,f,record)).join('');
  const entries=[...rows].sort((a,b)=>String(a.name||a.title||a.date||a.issue||a.id).localeCompare(String(b.name||b.title||b.date||b.issue||b.id))).map(x=>{
    const label=x.name||x.title||x.label||x.issue||x.id;
    return `<div class="admin-item"><span>${esc(label)}</span><code class="mu">${esc(x.id)}</code><button type="button" data-edit-kind="${kind}" data-id="${esc(x.id)}">編輯</button><button type="button" data-delete-kind="${kind}" data-id="${esc(x.id)}">刪除</button></div>`;
  }).join('');
  return `<details class="c" ${editingDoc?.kind===kind?'open':''}><summary><b style="display:inline;font-size:16px">${esc(title)}（${rows.length}）</b></summary><form data-admin-form="${kind}" class="admin-list">${fields}${record?`<button type="button" data-cancel-edit>取消</button><button type="submit">儲存</button>`:`<button type="submit">新增</button>`}</form>${entries}</details>`;
}
function adminPanel(){
  return `<div class="c"><b style="font-size:16px">批次匯入/匯出</b><div class="row"><input id="importJson" type="file" accept="application/json"><button type="button" data-a="import">匯入 JSON</button><button type="button" data-a="export">匯出 JSON</button></div></div>
  ${adminCollection('events','活動')} ${adminCollection('members','團員')} ${adminCollection('songs','曲目')} ${adminCollection('sessions','場次')} ${adminCollection('logs','紀錄')}`;
}
function validateImportPayload(data){
  if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('JSON 最上層必須是物件');
  const keys=Object.keys(data);
  if(keys.length!==IMPORT_COLLECTIONS.length||IMPORT_COLLECTIONS.some(name=>!Object.hasOwn(data,name)))throw new Error('匯出檔必須包含 events、members、songs、sessions、attendance、scores、logs');
  for(const name of IMPORT_COLLECTIONS){
    const rows=data[name];
    if(!rows||typeof rows!=='object'||Array.isArray(rows))throw new Error(`${name} 必須是以文件 ID 為鍵的物件`);
    for(const [id,record] of Object.entries(rows)){
      if(!id||id.includes('/')||!record||typeof record!=='object'||Array.isArray(record))throw new Error(`${name} 有無效的文件 ID 或資料格式`);
    }
  }
  return data;
}
async function importExportJson(){
  if(importing)return;
  assertEditor();
  const input=$('#importJson'),file=input?.files?.[0];
  if(!file){$('#msg').textContent='請先選擇匯出 JSON 檔';return;}
  importing=true;
  try{
    const data=validateImportPayload(JSON.parse(await file.text()));
    const existing={};
    await Promise.all(IMPORT_COLLECTIONS.map(async name=>{
      const snapshot=await db.collection(name).get();
      existing[name]=new Set(snapshot.docs.map(doc=>doc.id));
    }));
    const counts=Object.fromEntries(IMPORT_COLLECTIONS.map(name=>{
      const total=Object.keys(data[name]).length,skipped=Object.keys(data[name]).filter(id=>existing[name].has(id)).length;
      return[name,{total,skipped,added:total-skipped}];
    }));
    const totalAdded=IMPORT_COLLECTIONS.reduce((n,name)=>n+counts[name].added,0);
    const totalSkipped=IMPORT_COLLECTIONS.reduce((n,name)=>n+counts[name].skipped,0);
    if(!totalAdded){$('#msg').textContent=`沒有新增資料；${totalSkipped} 筆文件 ID 已存在。`;return;}
    const detail=IMPORT_COLLECTIONS.map(name=>`${name}：新增 ${counts[name].added}、略過 ${counts[name].skipped}`).join('\n');
    if(!confirm(`匯入前確認（相同 ID 會略過，不覆蓋）：\n${detail}\n\n共新增 ${totalAdded} 筆、略過 ${totalSkipped} 筆。繼續嗎？`))return;
    let added=0,skipped=0,collection='';
    for(const name of IMPORT_ORDER){
      collection=name;
      const entries=Object.entries(data[name]);
      for(let i=0;i<entries.length;i+=10){
        const chunk=entries.slice(i,i+10).map(([id,value])=>({ref:db.collection(name).doc(id),value}));
        const result=await db.runTransaction(async transaction=>{
          const snapshots=await Promise.all(chunk.map(item=>transaction.get(item.ref)));
          let created=0;
          snapshots.forEach((snapshot,index)=>{
            if(snapshot.exists)return;
            transaction.set(chunk[index].ref,chunk[index].value);
            created++;
          });
          return{created,skipped:chunk.length-created};
        });
        added+=result.created;skipped+=result.skipped;
      }
    }
    $('#msg').textContent=`匯入完成：新增 ${added} 筆、略過 ${skipped} 筆。`;
  }catch(error){
    $('#msg').textContent=`匯入失敗${collection?`（處理 ${collection} 時）`:''}：${error.message||error.code||error}`;
  }finally{
    importing=false;if(input)input.value='';render();
  }
}
const g=(id)=>$('#'+id);
document.addEventListener('click',async ev_=>{
  const b=ev_.target.closest('[data-t],[data-a]');if(!b)return;const d=b.dataset;
  if(d.t){tab=d.t;edit=false;render();return;}
  try{switch(d.a){
    case 'edit':edit=!edit;render();break;
    case 'showout':showOut=!showOut;render();break;
    case 'import':await importExportJson();break;
    case 'export':{
      assertEditor();
      const payload={};
      for(const name of IMPORT_COLLECTIONS){
        const rows={};
        const snap=await db.collection(name).get();
        snap.forEach(doc=>rows[doc.id]=doc.data());
        payload[name]=rows;
      }
      const href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(payload,null,2));
      const a=document.createElement('a');
      a.href=href;a.download='gcm-export.json';a.click();
      $('#msg').textContent='已匯出 JSON';
      break;
    }
    case 'addlog':{
      assertEditor();
      const sessionId=g('logSession')?.value||'';
      const songId=g('logSong')?.value||'';
      const issue=g('logIssue')?.value.trim()||'';
      const fix=g('logFix')?.value.trim()||'';
      if(!issue){$('#msg').textContent='請填寫問題內容';return;}
      await db.collection('logs').add({eventId:ev,sessionId:songId?sessionId:'',songId,issue,fix,done:false,ts:Date.now()});
      $('#msg').textContent='已新增練習紀錄';
      g('logIssue').value='';g('logFix').value='';
      break;
    }
    case 'att':{
      assertEditor();
      const c=(S.att[d.s]||{})[d.m]||'?';
      const next={y:'n',n:'?', '?':'y'}[c];
      await db.doc(`attendance/${d.s}__${d.m}`).set({sessionId:d.s,memberId:d.m,value:next});
      break;
    }
    case 'lead':{
      assertEditor();
      const song=S.songs.find(x=>x.id===d.s); if(!song) return;
      const next=Array.isArray(song.leaders)?song.leaders:[];
      const leaders=next.includes(d.m)?next.filter(id=>id!==d.m):[...next,d.m];
      await db.collection('songs').doc(d.s).update({leaders});
      break;
    }
    case 'del':if(confirm('確定刪除？'))await db.doc(d.p).delete();break;
  }}catch(x){$('#msg').textContent='無法儲存（可能沒有編輯權限）：'+(x.message||x.code)}
});
document.addEventListener('click',async ev_=>{
  const b=ev_.target.closest('#authBtn,[data-edit-kind],[data-delete-kind],[data-cancel-edit]');if(!b)return;
  try{
    if(b.id==='authBtn'){
      if(user)await auth.signOut();
      else await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    }else if(b.hasAttribute('data-cancel-edit')){
      editingDoc=null;render();
    }else if(b.dataset.editKind){
      editingDoc={kind:b.dataset.editKind,id:b.dataset.id};render();
    }else if(b.dataset.deleteKind){
      const kind=b.dataset.deleteKind;
      assertEditor();
      if(confirm(`確定刪除這筆${kind}資料？此操作無法復原。`)){
        await db.collection(kind).doc(b.dataset.id).delete();
        if(editingDoc?.kind===kind&&editingDoc.id===b.dataset.id)editingDoc=null;
        $('#msg').textContent='資料已刪除';
      }
    }
  }catch(x){$('#msg').textContent='登入或操作失敗：'+(x.message||x.code)}
});
document.addEventListener('submit',async ev_=>{
  const form=ev_.target.closest('[data-admin-form]');if(!form)return;
  ev_.preventDefault();
  try{
    assertEditor();
    const kind=form.dataset.adminForm,record=editingDoc?.kind===kind?S[kind].find(x=>x.id===editingDoc.id):null,data={};
    for(const field of ADMIN_FIELDS[kind]){
      const [name,label,type]=field,input=form.querySelector(`[data-field="${name}"]`);
      if(!input)continue;
      if(type==='checkbox')data[name]=input.checked;
      else if(type==='array')data[name]=Array.from(input.selectedOptions,option=>option.value);
      else if(type==='number'){
        if(input.value.trim()!==''){
          const n=Number(input.value);
          if(!Number.isInteger(n))throw new Error(`${label}請輸入整數`);
          data[name]=n;
        }
      }else data[name]=input.value.trim();
    }
    const required={events:['name','date'],members:['name'],songs:['eventId','title'],sessions:['eventId','date'],logs:['issue']}[kind];
    for(const name of required)if(!data[name])throw new Error(`請填寫${ADMIN_FIELDS[kind].find(f=>f[0]===name)[1]}`);
    if(kind==='logs')data.ts=record?.ts||Date.now();
    const ref=record?db.collection(kind).doc(record.id):db.collection(kind).doc();
    await ref.set(data);
    editingDoc=null;$('#msg').textContent='資料已儲存';render();
  }catch(x){$('#msg').textContent='無法儲存：'+(x.message||x.code)}
});
document.addEventListener('change',async c=>{
  const t=c.target,d=t.dataset;if(!d.a)return;
  try{
    if(d.a==='ev'){ev=t.value;try{localStorage.setItem('ev',ev)}catch(x){}render();}
    if(d.a==='status'){assertEditor();await db.doc(`songs/${d.s}`).update({status:t.value});}
    if(d.a==='out'){assertEditor();const current=new Set(E().out||[]);if(t.checked)current.delete(d.m);else current.add(d.m);await db.doc(`events/${E().id}`).update({out:[...current]});}
    if(d.a==='done'){assertEditor();await db.doc(`logs/${d.id}`).update({done:t.checked});}
    if(d.a==='score'){assertEditor();const n=Number(t.value);if(!Number.isInteger(n)||n<1||n>10){$('#msg').textContent='分數請輸入 1 到 10 的整數';return;}await db.doc(`scores/${d.m}__${d.s}`).set({memberId:d.m,songId:d.s,value:n});$('#msg').textContent='';}
  }catch(x){$('#msg').textContent='無法儲存：'+(x.message||x.code)}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend)render()},50));
function startDataListeners(){
  sub('events',d=>S.events=d);
  sub('members',d=>S.members=d.sort((a,b)=>(a.order||0)-(b.order||0)));
  sub('songs',d=>S.songs=d);
  sub('sessions',d=>S.sessions=d);
  recordSub('attendance','att','sessionId','memberId');
  recordSub('scores','scores','memberId','songId');
  sub('logs',d=>S.logs=d);
}
const configReady=Object.values(FIREBASE_CONFIG).every(v=>v&&!v.startsWith('YOUR_'));
if(!configReady){
  $('#app').innerHTML='請先在 HTML 的 FIREBASE_CONFIG 填入 Firebase 網頁應用程式設定。';
}else{
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth();
    db=firebase.firestore();
    auth.onAuthStateChanged(async next=>{
      user=next;editor=false;editingDoc=null;render();
      if(!next)return;
      try{
        const doc=await db.doc(`editorStatus/${next.uid}`).get();
        if(user?.uid!==next.uid)return;
        editor=doc.exists;
        if(editor)$('#msg').textContent='';
        render();
      }catch(error){
        if(user?.uid!==next.uid)return;
        editor=false;
        if(error.code==='permission-denied')$('#authState').textContent=`已登入：${next.email||'Google 帳號'}（僅可瀏覽）`;
        else $('#msg').textContent='無法確認修改權限：'+(error.message||error.code);
        render();
      }
    });
    startDataListeners();
  }catch(error){
    $('#app').textContent='Firebase 初始化失敗：'+(error.message||error.code);
  }
}
