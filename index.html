function adminPanel(){return `<div class="c"><b style="font-size:16px">批次匯入/匯出</b><div class="row"><input id="importJson" type="file" accept="application/json"><button data-a="import">匯入 JSON</button><button data-a="export">匯出 JSON</button></div></div>${adminCollection('events','活動')}${adminCollection('members','團員')}${adminCollection('songs','曲目')}${adminCollection('sessions','場次')}${adminCollection('logs','紀錄')}`}function set(e){return `<h2>設定</h2>${e?`<div class="c"><b>${esc(e.name)}</b><span>${esc(dateText(e.date))} ${esc(e.place||'')}</span></div>`:'<div class="c">尚無活動</div>'}<h2>資料管理（管理者）</h2>${isEditor()?adminPanel():'<div class="c mu">請以授權的管理者帳號登入以管理資料。</div>'}`}
function validateImportPayload(data){if(!data||typeof data!=='object'||Array.isArray(data)||Object.keys(data).length!==IMPORT_COLLECTIONS.length||IMPORT_COLLECTIONS.some(k=>!Object.hasOwn(data,k)))throw Error('JSON 必須包含 events、members、songs、sessions、attendance、scores、logs');for(const n of IMPORT_COLLECTIONS){const rows=data[n];if(!rows||typeof rows!=='object'||Array.isArray(rows))throw Error(`${n} 必須是以文件 ID 為鍵的物件`);for(const[id,row]of Object.entries(rows))if(!id||id.includes('/')||!row||typeof row!=='object'||Array.isArray(row))throw Error(`${n} 有無效的文件 ID 或資料格式`)}return data}
async function importExportJson(){assertEditor();if(importing)return;const input=$('#importJson'),file=input?.files?.[0];if(!file){$('#msg').textContent='請先選擇匯出 JSON 檔';return}importing=true;let collection='';try{const data=validateImportPayload(JSON.parse(await file.text())),existing={};await Promise.all(IMPORT_COLLECTIONS.map(async n=>{const q=await db.collection(n).get();existing[n]=new Set(q.docs.map(x=>x.id))}));const counts=Object.fromEntries(IMPORT_COLLECTIONS.map(n=>[n,{total:Object.keys(data[n]).length,skipped:Object.keys(data[n]).filter(id=>existing[n].has(id)).length}])),added=Object.values(counts).reduce((a,x)=>a+x.total-x.skipped,0),skipped=Object.values(counts).reduce((a,x)=>a+x.skipped,0);if(!added){$('#msg').textContent=`沒有新增資料；${skipped} 筆文件 ID 已存在。`;return}const detail=IMPORT_COLLECTIONS.map(n=>`${n}：新增 ${counts[n].total-counts[n].skipped}、略過 ${counts[n].skipped}`).join('\n');if(!confirm(`匯入前確認（相同 ID 會略過，不覆蓋）：\n${detail}\n\n共新增 ${added} 筆、略過 ${skipped} 筆。繼續嗎？`))return;let created=0,ignored=0;for(const n of IMPORT_ORDER){collection=n;const entries=Object.entries(data[n]);for(let i=0;i<entries.length;i+=10){const chunk=entries.slice(i,i+10).map(([id,value])=>({ref:db.collection(n).doc(id),value})),result=await db.runTransaction(async tx=>{const docs=await Promise.all(chunk.map(x=>tx.get(x.ref)));let count=0;docs.forEach((snap,j)=>{if(!snap.exists){tx.set(chunk[j].ref,chunk[j].value);count++}});return{created:count,ignored:chunk.length-count}});created+=result.created;ignored+=result.ignored}}$('#msg').textContent=`匯入完成：新增 ${created} 筆、略過 ${ignored} 筆。`}catch(error){$('#msg').textContent=`匯入失敗${collection?`（處理 ${collection} 時）`:''}：${error.message||error.code||error}`}finally{importing=false;if(input)input.value='';render()}}
const byId=id=>$('#'+id);
document.addEventListener('click',async event=>{const b=event.target.closest('[data-t],[data-a]');if(!b)return;const d=b.dataset;if(d.t){tab=d.t;editingDoc=null;render();return}try{switch(d.a){case'showout':showOut=!showOut;render();break;case'import':await importExportJson();break;case'export':{assertEditor();const payload={};for(const n of IMPORT_COLLECTIONS){const rows={},q=await db.collection(n).get();q.forEach(doc=>rows[doc.id]=doc.data());payload[n]=rows}const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(payload,null,2));a.download='gcm-export.json';a.click();$('#msg').textContent='已匯出 JSON';break}case'addlog':{assertEditor();const sessionId=byId('logSession').value||'',songId=byId('logSong').value||'',issue=byId('logIssue').value.trim(),fix=byId('logFix').value.trim();if(!issue){$('#msg').textContent='請填寫問題內容';return}await db.collection('logs').add({eventId:ev,sessionId,songId,issue,fix,done:false,ts:Date.now()});$('#msg').textContent='已新增練習紀錄';byId('logIssue').value='';byId('logFix').value='';break}case'att':{assertEditor();const old=(S.att[d.s]||{})[d.m]||'?',value={y:'n',n:'?','?':'y'}[old];await db.doc(`attendance/${d.s}__${d.m}`).set({sessionId:d.s,memberId:d.m,value});break}case'del':{assertEditor();if(confirm('確定刪除？'))await db.doc(d.p).delete();break}}}catch(error){$('#msg').textContent='無法儲存（可能沒有編輯權限）：'+(error.message||error.code)}});
document.addEventListener('click',async event=>{const b=event.target.closest('#authBtn,[data-edit-kind],[data-delete-kind],[data-cancel-edit]');if(!b)return;try{if(b.id==='authBtn'){if(user)await auth.signOut();else await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}else if(b.hasAttribute('data-cancel-edit')){editingDoc=null;render()}else if(b.dataset.editKind){editingDoc={kind:b.dataset.editKind,id:b.dataset.id};render()}else if(b.dataset.deleteKind){assertEditor();if(confirm('確定刪除這筆資料？此操作無法復原。')){await db.collection(b.dataset.deleteKind).doc(b.dataset.id).delete();if(editingDoc?.id===b.dataset.id)editingDoc=null;$('#msg').textContent='資料已刪除'}}}catch(error){$('#msg').textContent='登入或操作失敗：'+(error.message||error.code)}});
document.addEventListener('submit',async event=>{const form=event.target.closest('[data-admin-form]');if(!form)return;event.preventDefault();try{assertEditor();const kind=form.dataset.adminForm,record=editingDoc?.kind===kind?S[kind].find(x=>x.id===editingDoc.id):null,data={};for(const[name,label,type]of ADMIN_FIELDS[kind]){const input=form.querySelector(`[data-field="${name}"]`);if(!input)continue;if(type==='checkbox')data[name]=input.checked;else if(type==='array')data[name]=Array.from(input.selectedOptions,x=>x.value);else if(type==='number'){if(input.value.trim()!==''){const n=Number(input.value);if(!Number.isInteger(n))throw Error(`${label}請輸入整數`);data[name]=n}}else data[name]=input.value.trim()}const required={events:['name','date'],members:['name'],songs:['eventId','title'],sessions:['eventId','date'],logs:['eventId','issue']}[kind]||[];for(const name of required)if(!data[name])throw Error(`請填寫${ADMIN_FIELDS[kind].find(x=>x[0]===name)[1]}`);if(kind==='logs')data.ts=record?.ts||Date.now();await(record?db.collection(kind).doc(record.id):db.collection(kind).doc()).set(data);editingDoc=null;$('#msg').textContent='資料已儲存';render()}catch(error){$('#msg').textContent='無法儲存：'+(error.message||error.code)}});
document.addEventListener('change',async event=>{const t=event.target,d=t.dataset;if(!d.a)return;try{if(d.a==='ev'){ev=t.value;try{localStorage.setItem('ev',ev)}catch{}render()}else if(d.a==='status'){assertEditor();await db.doc(`songs/${d.s}`).update({status:t.value})}else if(d.a==='out'){assertEditor();const current=new Set(E().out||[]);if(t.checked)current.delete(d.m);else current.add(d.m);await db.doc(`events/${E().id}`).update({out:[...current]})}else if(d.a==='done'){assertEditor();await db.doc(`logs/${d.id}`).update({done:t.checked})}else if(d.a==='score'){assertEditor();const n=Number(t.value);if(!Number.isInteger(n)||n<1||n>10){$('#msg').textContent='分數請輸入 1 到 10 的整數';return}await db.doc(`scores/${d.m}__${d.s}`).set({memberId:d.m,songId:d.s,value:n});$('#msg').textContent=''}else if(d.a==='leaderRole'){assertEditor();const song=S.songs.find(x=>x.id===d.s);if(!song)throw Error('找不到曲目');const roles=rolesOf(song);if(t.value)roles[d.m]=t.value;else delete roles[d.m];await db.collection('songs').doc(d.s).update({leaderRoles:roles,leaders:Object.keys(roles)});$('#msg').textContent='領唱角色已更新'}}catch(error){$('#msg').textContent='無法儲存：'+(error.message||error.code);render()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend)render()},50));
function startDataListeners(){sub('events',d=>S.events=d);sub('members',d=>S.members=d.sort((a,b)=>(a.order||0)-(b.order||0)));sub('songs',d=>S.songs=d);sub('sessions',d=>S.sessions=d);recordSub('attendance','att','sessionId','memberId');recordSub('scores','scores','memberId','songId');sub('logs',d=>S.logs=d)}
try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async next=>{user=next;editor=false;editingDoc=null;render();if(!next)return;try{await db.doc(`editorStatus/${next.uid}`).get();if(user?.uid!==next.uid)return;editor=true;$('#msg').textContent='';render()}catch(error){if(user?.uid!==next.uid)return;editor=false;if(error.code==='permission-denied')$('#authState').textContent=`已登入：${next.email||'Google 帳號'}（僅可瀏覽）`;else $('#msg').textContent='無法確認修改權限：'+(error.message||error.code);render()}});startDataListeners()}catch(error){$('#app').textContent='Firebase 初始化失敗：'+(error.message||error.code)}
</script></body></html>
