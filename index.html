document.addEventListener('click',async event=>{const b=event.target.closest('[data-t],[data-a]');if(!b)return;const d=b.dataset;if(d.t){tab=d.t;editingDoc=null;render();return}try{switch(d.a){case'showout':showOut=!showOut;render();break;case'csv':exportRosterCsv(E());break;case'print':printRoster(E());break;case'addlog':{assertEditor();const issue=val('logIssue');if(!issue){setMsg('請填寫問題內容');return}await db.collection('logs').add({eventId:ev,sessionId:val('logSession'),songId:val('logSong'),issue,fix:val('logFix'),done:false,ts:Date.now()});setMsg('已新增練習紀錄');render();break}case'att':{assertEditor();const old=(S.att[d.s]||{})[d.m]||'?',value={y:'n',n:'?','?':'y'}[old];await db.doc(`attendance/${d.s}__${d.m}`).set({sessionId:d.s,memberId:d.m,value});break}case'done':assertEditor();await db.doc(`logs/${d.id}`).update({done:b.checked});break;case'del':assertEditor();if(confirm('確定刪除？'))await db.doc(d.p).delete();break;case'addEvent':assertEditor();if(!val('eventName')||!val('eventDate'))throw Error('請填寫活動名稱與日期');{const ref=await db.collection('events').add({name:val('eventName'),date:val('eventDate'),out:[]});ev=ref.id;localStorage.setItem('ev',ev)}break;case'addMember':assertEditor();if(val('memberName'))await db.collection('members').add({name:val('memberName'),order:Date.now()});break;case'addSong':assertEditor();if(!val('songTitle'))throw Error('請輸入曲名');if(!E())throw Error('請先新增活動');await db.collection('songs').add({eventId:E().id,title:val('songTitle'),key:val('songKey'),leaders:[],leaderRoles:{},status:'todo',order:Date.now()});break;case'addSession':assertEditor();if(!val('sessionDate'))throw Error('請選擇場次日期');await db.collection('sessions').add({eventId:E().id,date:val('sessionDate'),label:val('sessionLabel')});break;case'exportJson':{assertEditor();const payload={};for(const n of ['events','members','songs','sessions','attendance','scores','logs']){const snap=await db.collection(n).get();payload[n]=Object.fromEntries(snap.docs.map(x=>[x.id,x.data()]))}download('gcm-export.json',JSON.stringify(payload,null,2),'application/json');break}}}catch(error){setMsg('無法完成操作：'+(error.message||error.code))}});
document.addEventListener('click',async event=>{const b=event.target.closest('#authBtn');if(!b)return;try{if(user)await auth.signOut();else await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(error){setMsg('登入失敗：'+(error.message||error.code))}});
document.addEventListener('change',async event=>{const t=event.target,d=t.dataset;if(!d.a)return;try{if(d.a==='ev'){ev=t.value;try{localStorage.setItem('ev',ev)}catch{}render()}else if(d.a==='status'){assertEditor();await db.doc(`songs/${d.s}`).update({status:t.value})}else if(d.a==='score'){assertEditor();if(t.value==='')return;const n=Number(t.value);if(!Number.isInteger(n)||n<1||n>10)throw Error('分數請輸入 1 到 10 的整數');await db.doc(`scores/${d.m}__${d.s}`).set({memberId:d.m,songId:d.s,value:n})}else if(d.a==='leaderRole'){assertEditor();const ref=db.collection('songs').doc(d.s);await db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists)throw Error('找不到曲目');const song={id:snap.id,...snap.data()},roles=rolesOf(song);if(t.value==='主唱'&&roles[d.m]!=='主唱'&&Object.values(roles).filter(x=>x==='主唱').length>=ROLE_LIMIT)throw Error(`每首曲目最多指定 ${ROLE_LIMIT} 位主唱`);if(t.value)roles[d.m]=t.value;else delete roles[d.m];tx.update(ref,{leaderRoles:roles,leaders:Object.keys(roles)})});setMsg('領唱角色已更新')}else if(d.a==='out'){assertEditor();const current=new Set(E().out||[]);t.checked?current.delete(d.m):current.add(d.m);await db.doc(`events/${E().id}`).update({out:[...current]})}}catch(error){setMsg('無法儲存：'+(error.message||error.code));render()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend)render()},50));
function startDataListeners(){sub('events',d=>S.events=d);sub('members',d=>S.members=d.sort((a,b)=>(a.order||0)-(b.order||0)));sub('songs',d=>S.songs=d);sub('sessions',d=>S.sessions=d);recordSub('attendance','att','sessionId','memberId');recordSub('scores','scores','memberId','songId');sub('logs',d=>S.logs=d)}
try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async next=>{user=next;editor=false;render();if(!next)return;try{await db.doc(`editorStatus/${next.uid}`).get();if(user?.uid!==next.uid)return;editor=true;render()}catch(error){if(user?.uid!==next.uid)return;editor=false;render()}});startDataListeners()}catch(error){$('#app').textContent='Firebase 初始化失敗：'+(error.message||error.code)}
</script></body></html>
