async function exportJson(){assertAdmin();const names=['events','members','songs','sessions','attendance','scores','logs'],out={};for(const n of names){const snap=await db.collection(n).get();out[n]=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]))}download('gcm-export.json',JSON.stringify(out,null,2),'application/json')}
async function toggleAttendance(sid,mid){assertAdmin();const old=attendanceValue(sid,mid),next={y:'n',n:'?','?':'y'}[old];let reason='';if(next==='n'){reason=window.prompt('請填寫請假原因（可留空）',attendanceReason(sid,mid)||'');if(reason===null)return;if(reason.trim().length>300)throw Error('請假原因最多 300 字')}await db.doc(`attendance/${sid}__${mid}`).set({sessionId:sid,memberId:mid,value:next,...(next==='n'&&reason.trim()?{reason:reason.trim()}:{})})}
document.addEventListener('click',async event=>{const b=event.target.closest('[data-t],[data-a]');if(!b)return;const d=b.dataset,e=E();if(d.t){tab=d.t;editScores=false;render();return}try{switch(d.a){case'showout':showOut=!showOut;render();break;case'scoreMode':assertAdmin();editScores=!editScores;render();break;case'csv':if(e)exportCsv(e);break;case'print':if(e)printSongs(e);break;case'lead':{assertAdmin();const song=S.songs.find(s=>s.id===d.s);if(!song)throw Error('找不到曲目');const leaders=LD(song),next=leaders.includes(d.m)?leaders.filter(x=>x!==d.m):[...leaders,d.m];await db.doc(`songs/${d.s}`).update({leaders:next,leader:''});break}case'att':await toggleAttendance(d.s,d.m);break;case'done':assertAdmin();await db.doc(`logs/${d.id}`).update({done:b.checked});break;case'del':assertAdmin();if(confirm('確定刪除？'))await db.doc(d.p).delete();break;case'addlog':assertAdmin();if(!val('logIssue'))throw Error('請填寫問題內容');if(!val('logSession'))throw Error('請先新增練習場次');await db.collection('logs').add({eventId:e.id,sessionId:val('logSession'),songId:val('logSong'),issue:val('logIssue'),fix:val('logFix'),done:false,ts:Date.now()});message('練習紀錄已新增');break;case'addEvent':assertAdmin();if(!val('eventName')||!val('eventDate'))throw Error('請填寫活動名稱與日期');{const ref=await db.collection('events').add({name:val('eventName'),date:val('eventDate'),place:val('eventPlace'),out:[]});ev=ref.id;try{localStorage.setItem('ev',ev)}catch{}}message('活動已新增');break;case'addMember':assertAdmin();if(!val('memberName'))throw Error('請輸入團員姓名');await db.collection('members').add({name:val('memberName'),gender:$('#memberGender').value,order:Date.now()});message('團員已新增');break;case'addSong':assertAdmin();if(!e)throw Error('請先新增活動');if(!val('songTitle'))throw Error('請輸入曲名');{const link=val('songLink');if(link&&!safe(link))throw Error('歌曲連結請使用 http:// 或 https://');await db.collection('songs').add({eventId:e.id,title:val('songTitle'),key:val('songKey'),link,leaders:[],leader:'',status:'todo',order:Date.now()})}message('曲目已新增');break;case'addSession':assertAdmin();if(!e)throw Error('請先新增活動');if(!val('sessionDate'))throw Error('請選擇場次日期');await db.collection('sessions').add({eventId:e.id,date:val('sessionDate'),label:val('sessionLabel')});message('場次已新增');break;case'exportJson':await exportJson();break}}catch(error){message('操作失敗：'+(error.message||error.code));console.error(error)}});
document.addEventListener('change',async event=>{const t=event.target,d=t.dataset;if(!d.a)return;try{if(d.a==='ev'){ev=t.value;try{localStorage.setItem('ev',ev)}catch{}render();return}if(d.a==='status'){assertAdmin();await db.doc(`songs/${d.s}`).update({status:t.value})}if(d.a==='score'){assertAdmin();if(t.value==='')return;const n=Number(t.value);if(!Number.isInteger(n)||n<1||n>10)throw Error('分數請輸入 1 到 10 的整數');await db.doc(`scores/${d.m}__${d.s}`).set({memberId:d.m,songId:d.s,value:n})}if(d.a==='out'){assertAdmin();const out=new Set(E().out||[]);t.checked?out.delete(d.m):out.add(d.m);await db.doc(`events/${E().id}`).update({out:[...out]})}}catch(error){message('儲存失敗：'+(error.message||error.code));console.error(error)}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(renderPending)render()},80));
$('#authBtn').addEventListener('click',async()=>{try{if(user){await auth.signOut();message('已登出')}else{const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await auth.signInWithPopup(provider)}}catch(error){message('Google 登入失敗：'+(error.message||error.code)+'。請確認 Firebase 已啟用 Google 登入，且目前網站網域在 Authorized domains 清單中。');console.error(error)}});
try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async next=>{user=next;isEditor=false;render();if(next){try{if(!next.email)throw Error('Google 帳號未提供 email');const snap=await db.doc(`editors/${next.email}`).get();isEditor=snap.exists&&snap.data().active===true;if(!isEditor)message(`帳號 ${next.email} 尚未獲管理者授權；目前僅可瀏覽。`)}catch(error){isEditor=false;message('登入成功但管理者權限檢查失敗：'+(error.message||error.code)+'。請確認已發布 firestore.rules。')} }render()});sub('events',d=>S.events=d);sub('members',d=>S.members=d.sort((a,b)=>(a.order||0)-(b.order||0)));sub('songs',d=>S.songs=d);sub('sessions',d=>S.sessions=d);sub('logs',d=>S.logs=d);subscribeRecords()}catch(error){$('#app').textContent='Firebase 初始化失敗：'+(error.message||error.code);console.error(error)}
</script></body></html>
