<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCM領唱練習儀表板</title>
<style>
:root{--bg:#faf8f5;--cd:#fff;--tx:#2a2622;--mu:#7a726a;--ln:#e7e1d9;--ac:#b4562f;--ok:#2f8f5b;--no:#c0443c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1917;--cd:#262321;--tx:#f0ebe5;--mu:#a39b92;--ln:#3a3631;--ac:#e0875f;--ok:#55c488;--no:#e5766e;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1b1917;--cd:#262321;--tx:#f0ebe5;--mu:#a39b92;--ln:#3a3631;--ac:#e0875f;--ok:#55c488;--no:#e5766e;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding:0 14px 40px}
.w{max-width:960px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 0 8px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:22px 0 8px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px}
nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.c b{display:block;font-size:24px}.c span,.mu{color:var(--mu);font-size:13px}
.sc{overflow-x:auto;background:var(--cd);border:1px solid var(--ln);border-radius:12px}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--cd)}
th{font-weight:600;font-size:13px;color:var(--mu)}tr:last-child td{border-bottom:0}
td.h{cursor:pointer;font-weight:600}td.sel{outline:3px solid var(--ac);outline-offset:-3px}
td input{width:54px;padding:3px}
.y{color:var(--ok);font-weight:700}.n{color:var(--no)}.q{color:var(--mu)}.dim{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.row input[type=text],.row textarea{flex:1;min-width:140px}
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--ln)}.it:last-child{border:0}
.x{margin-left:auto;border:0;background:none;color:var(--mu)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
</style></head><body><div class="w">
<header><h1>🎶 讚頌團 練習儀表板</h1><div class="row"><select id="evsel" data-a="ev"></select><span class="mu">公開瀏覽 · 可編輯出缺席與分數</span></div></header>
<nav id="nav"></nav><div id="msg" class="mu"></div><div id="app">載入中…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const S={events:[],members:[],songs:[],sessions:[],att:{},scores:{},logs:[]};
const FIREBASE_CONFIG={
 apiKey:'YOUR_API_KEY',
 authDomain:'YOUR_PROJECT_ID.firebaseapp.com',
 projectId:'YOUR_PROJECT_ID',
 appId:'YOUR_APP_ID'
};
let db=null,ev=null,tab='home',edit=false,pend=false,showOut=false;
try{ev=localStorage.getItem('ev')}catch(e){}
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const TABS=[['home','總覽'],['songs','曲目與人選'],['att','出缺席'],['log','練習紀錄'],['set','設定']];
const ST={todo:'未練',wip:'練習中',ok:'已 OK'};
function sub(name,fn){return db.collection(name).onSnapshot(q=>{fn(q.docs.map(d=>({id:d.id,...d.data()})));render()},e=>{$('#msg').textContent='資料讀取失敗：'+(e.message||e.code)})}
function recordSub(name,key,parentField,childField){
 return db.collection(name).onSnapshot(q=>{
  const records={};
  q.docs.forEach(doc=>{
   const data=doc.data(),parent=data[parentField],child=data[childField];
   if(typeof parent!=='string'||typeof child!=='string')return;
   records[parent]??={};
   records[parent][child]=data.value;
  });
  S[key]=records;render();
 },e=>{$('#msg').textContent='資料讀取失敗：'+(e.message||e.code)});
}
function E(){return S.events.find(e=>e.id===ev)||S.events.find(e=>e.date>=today())||S.events[S.events.length-1]}
const byo=(a,b)=>(a.order||0)-(b.order||0);
function render(){
 if(document.activeElement?.matches('input[type=text],input[type=date],input[type=number],textarea')){pend=true;return}
 pend=false;
 $('#nav').innerHTML=TABS.map(([k,v])=>`<button class="${tab===k?'on':''}" data-t="${k}">${v}</button>`).join('');
 const e=E();
 $('#evsel').innerHTML=S.events.map(x=>`<option value="${x.id}" ${e&&x.id===e.id?'selected':''}>${esc(x.date)} ${esc(x.name)}</option>`).join('');
 if(!e&&tab!=='set'){$('#app').innerHTML='<p>尚無活動，請到「設定」新增第一個活動。</p>';return}
 $('#app').innerHTML=({home,songs,att,log,set})[tab](e);
}
function ctx(e){const songs=S.songs.filter(s=>s.eventId===e?.id).sort(byo),sess=S.sessions.filter(s=>s.eventId===e?.id).sort((a,b)=>a.date.localeCompare(b.date));return{songs,sess}}
const mn=id=>S.members.find(m=>m.id===id)?.name||'';
const AM=e=>S.members.filter(m=>showOut||!(e.out||[]).includes(m.id));
const LD=s=>Array.isArray(s.leaders)?s.leaders:(s.leader?[s.leader]:[]);
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const ttl=s=>safe(s.link)?`<a href="${esc(safe(s.link))}" target="_blank" rel="noopener" style="color:var(--ac)">${esc(s.title)} 🔗</a>`:esc(s.title);
function home(e){
 const{songs,sess}=ctx(e),ok=songs.filter(s=>s.status==='ok').length,nol=songs.filter(s=>!LD(s).some(id=>!(e.out||[]).includes(id))),open=S.logs.filter(l=>l.eventId===e.id&&!l.done);
 const days=Math.ceil((new Date(e.date)-new Date(today()))/864e5),nx=sess.find(s=>s.date>=today());
 const act=S.members.filter(m=>!(e.out||[]).includes(m.id)),cnt=nx?act.filter(m=>(S.att[nx.id]||{})[m.id]==='y').length:0;
 return `<div class="c" style="margin-bottom:10px"><b>${esc(e.name)}</b><span>${esc(e.date)} ${esc(e.place||'')} · ${days>=0?'倒數 '+days+' 天':'已結束'}</span></div>
 <div class="g"><div class="c"><b>${ok}/${songs.length}</b><span>曲目已 OK</span></div><div class="c"><b>${nol.length}</b><span>尚未指定領唱</span></div>
 <div class="c"><b>${nx?cnt+'/'+act.length:'–'}</b><span>${nx?'下次練習 '+esc(nx.date.slice(5))+' 可到':'無待練場次'}</span></div><div class="c"><b>${open.length}</b><span>未解決改善項目</span></div></div>
 <h2>待辦</h2><div class="c" style="padding:0">${[...nol.map(s=>`<div class="it">🎤 〈${esc(s.title)}〉還沒有領唱人選</div>`),...open.map(l=>`<div class="it">🔧 〈${esc(S.songs.find(s=>s.id===l.songId)?.title||'整體')}〉${esc(l.issue)} <span class="mu">→ ${esc(l.fix||'待討論')}</span></div>`)].join('')||'<div class="it mu">目前沒有待辦 🎉</div>'}</div>`}
function heat(n){return n==null?'':`background:hsl(${(n-1)*13} 60% 50% / .3)`}
function songs(e){
 const{songs}=ctx(e),M=AM(e);
 return `<div class="row"><span class="mu">點「編輯分數」可修改分數；任何訪客都能修改所有人的分數。</span><button data-a="showout" class="${showOut?'on':''}" style="margin-left:auto">顯示未參加者</button><button data-a="edit" class="${edit?'on':''}">${edit?'完成編輯分數':'編輯分數'}</button></div>
 <div class="sc"><table><tr><th>曲目</th><th>Key</th><th>領唱</th>${M.map(m=>`<th>${esc(m.name)}${(e.out||[]).includes(m.id)?'<br><span class="q">不參加</span>':''}</th>`).join('')}<th>狀態</th></tr>
 ${songs.map(s=>`<tr><td>${ttl(s)}</td><td>${esc(s.key||'')}</td><td>${esc(LD(s).filter(id=>M.some(m=>m.id===id)).map(mn).join('、'))||'<span class="q">–</span>'}</td>${M.map(m=>{const raw=(S.scores[m.id]||{})[s.id],v=Number.isInteger(raw)&&raw>=1&&raw<=10?raw:null;return edit?`<td><input type="number" min="1" max="10" step="1" value="${v??''}" data-a="score" data-s="${s.id}" data-m="${m.id}"></td>`:`<td class="${LD(s).includes(m.id)?'sel':''}" style="${heat(v)}">${v??'–'}</td>`}).join('')}
 <td>${esc(ST[s.status]||'未練')}</td></tr>`).join('')}</table></div>`}
function att(e){
 const{sess}=ctx(e),M=AM(e),t=today(),sym={y:'<span class="y">✓</span>',n:'<span class="n">請假</span>','?':'<span class="q">?</span>'};
 return `<div class="row"><span class="mu">點格子切換：✓ 出席 → 請假 → ? 未確認。任何訪客都能修改所有人的出席狀態。</span><button data-a="showout" class="${showOut?'on':''}" style="margin-left:auto">顯示未參加者</button></div><div class="sc"><table><tr><th>成員</th>${sess.map(s=>`<th class="${s.date<t?'dim':''}">${esc(s.date.slice(5))}<br>${esc(s.label||'')}</th>`).join('')}</tr>
 ${M.map(m=>`<tr><td>${esc(m.name)}${(e.out||[]).includes(m.id)?' <span class="q">（不參加）</span>':''}</td>${sess.map(s=>`<td class="h ${s.date<t?'dim':''}" data-a="att" data-s="${s.id}" data-m="${m.id}">${sym[(S.att[s.id]||{})[m.id]||'?']}</td>`).join('')}</tr>`).join('')}
 <tr><td><b>出席人數</b></td>${sess.map(s=>`<td><b>${M.filter(m=>(S.att[s.id]||{})[m.id]==='y').length}/${M.length}</b></td>`).join('')}</tr></table></div>`}
function log(e){
 const L=S.logs.filter(l=>l.eventId===e.id).sort((a,b)=>b.ts-a.ts);
 return `<h2>練習紀錄（唯讀）</h2><div class="c" style="padding:0">${L.map(l=>`<div class="it"><div style="${l.done?'opacity:.5':''}"><b>${esc(S.songs.find(s=>s.id===l.songId)?.title||'整體')}</b> <span class="tag">${esc(S.sessions.find(s=>s.id===l.sessionId)?.date.slice(5)||'')}</span><br>${esc(l.issue)}<br><span class="mu">→ ${esc(l.fix||'')}</span></div></div>`).join('')||'<div class="it mu">還沒有練習紀錄</div>'}</div>`}
function set(e){
 const{songs,sess}=ctx(e);
 return `<h2>設定（唯讀）</h2>${e?`<div class="c"><b>${esc(e.name)}</b><span>${esc(e.date)} ${esc(e.place||'')}</span></div><h2>曲目</h2><div class="c">${songs.map(s=>`<div class="it">${ttl(s)} <span class="mu">${esc(s.key||'')} · ${esc(ST[s.status]||'未練')}</span></div>`).join('')||'<span class="mu">尚無曲目</span>'}<h2>練習場次</h2>${sess.map(s=>`<div class="it">${esc(s.date)} ${esc(s.label||'')}</div>`).join('')||'<span class="mu">尚無場次</span>'}</div>`:''}<h2>團員</h2><div class="c">${S.members.map(m=>`<div class="it">${esc(m.name)} <span class="mu">${esc(m.gender||'')}</span></div>`).join('')||'<span class="mu">尚無團員</span>'}</div>`}
document.addEventListener('click',async ev_=>{
 const b=ev_.target.closest('[data-t],[data-a]');if(!b)return;const d=b.dataset;
 if(d.t){tab=d.t;edit=false;render();return}
 try{switch(d.a){
  case'edit':edit=!edit;render();break;
  case'showout':showOut=!showOut;render();break;
  case'att':{
   const c=(S.att[d.s]||{})[d.m]||'?',value={y:'n',n:'?','?':'y'}[c];
   await db.doc(`attendance/${d.s}__${d.m}`).set({sessionId:d.s,memberId:d.m,value});
   break;
  }
 }}catch(x){$('#msg').textContent='無法儲存（可能沒有編輯權限）：'+(x.message||x.code)}
});
document.addEventListener('change',async c=>{
 const t=c.target,d=t.dataset;if(!d.a)return;
 try{
  if(d.a==='ev'){ev=t.value;try{localStorage.setItem('ev',ev)}catch(x){}render()}
  if(d.a==='score'){
   const n=Number(t.value);
   if(!Number.isInteger(n)||n<1||n>10){$('#msg').textContent='分數請輸入 1 到 10 的整數';return}
   await db.doc(`scores/${d.m}__${d.s}`).set({memberId:d.m,songId:d.s,value:n});
   $('#msg').textContent='';
  }
 }catch(x){$('#msg').textContent='無法儲存：'+(x.message||x.code)}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend)render()},50));
function startDataListeners(){
 sub('events',d=>S.events=d);
 sub('members',d=>S.members=d.sort((a,b)=>(a.order||0)-(b.order||0)));
 sub('songs',d=>S.songs=d);
 sub('sessions',d=>S.sessions=d);
 recordSub('attendance','att','sessionId','memberId');
 recordSub('scores','scores','memberId','songId');
 sub('logs',d=>S.logs=d);
}
const configReady=Object.values(FIREBASE_CONFIG).every(v=>v&&!v.startsWith('YOUR_'));
if(!configReady){
 $('#app').innerHTML='請先在 HTML 的 FIREBASE_CONFIG 填入 Firebase 網頁應用程式設定。';
}else{
 try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();
  startDataListeners();
 }catch(error){
  $('#app').textContent='Firebase 初始化失敗：'+(error.message||error.code);
 }
}
</script></body></html>
